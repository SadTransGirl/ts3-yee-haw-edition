; Determinism test harness for the xinput1_4.dll proxy.
; This file must sit next to the game .exe. Edit, then launch the game.
[harness]
; passthrough | record | replay
mode=record

; Name of the recording (folder under harness\runs\).
; record: input is written to runs\<input>\input.bin
; replay: input is read from  runs\<input>\input.bin
input=run1

; replay only: where screenshots/log go. Defaults to <input>_replay.
; If that folder already has results, _2, _3 ... is appended automatically,
; so you can replay repeatedly without editing this file.
output=

; 1 = replace the game's clock (QueryPerformanceCounter, GetTickCount,
; timeGetTime) with a virtual clock that advances exactly 1/fps per input poll.
; The recording and its replays must all use the same value.
fixed_timestep=0
fps=60

; 1 = also freeze the wall clock (GetSystemTimeAsFileTime) at 2026-01-01.
; Catches RNGs seeded from time(). Save-file timestamps will be wrong.
freeze_wallclock=0

; Capture the game window every N polled frames (0 = off), up to max shots.
screenshot_interval=300
screenshot_max=200

; 1 = log every single XInput call (huge log; for diagnosing call patterns)
log_calls=0

; ---- Loading detection --------------------------------------------------
; While the game is loading, replay holds neutral input instead of feeding
; recorded presses into a loading screen. Each load in a replay is matched to
; the same-numbered load in the recording, however long either one took.
; A recording and its replays must use the same settings below.
load_detect=1

; Write io.csv (file reads per frame) for tuning: python harness\tune_loads.py <run>
io_log=1

; Loading starts when the game reads at least load_enter_kb within
; load_window frames, and ends after load_quiet_frames frames in a row each
; reading less than load_quiet_kb.
load_window=8
load_enter_kb=2048
load_quiet_kb=16
load_quiet_frames=30

; A single frame taking this many ms also counts as loading (0 = off).
load_hitch_ms=0

; Replay: if a recorded load is reached and no load happens within this many
; frames, give up waiting and continue (logged as a WARNING).
load_wait_frames=3600

; Whose file reads count: the game itself, the C runtime it reads through,
; Bink video, FMOD audio. Video and audio stream during play, so they're off.
load_use_exe=1
load_use_crt=1
load_use_bink=0
load_use_fmod=0

; ---- Save games -----------------------------------------------------------
; Record copies the game's save folder into runs\<name>\save_start. Replay
; backs up the current save to runs\<replay>\save_backup, then restores
; save_start, so every replay starts with the same coins and items.
save_restore=1
save_dir=%APPDATA%\Disney\Toy Story 3 Complete Edition\savedata

; ---- Determinism fixes from the decompiled game (see re\SYNC_VIABILITY.md) --
; With fixed_timestep=1: 1 = switch on the engine's own clock override and
; advance it exactly 1/fps per input frame (falls back to virtualising
; QueryPerformanceCounter if the game code doesn't match); 0 = always virtualise.
engine_clock=1

; 1 = each of the game's rand() call sites gets its own random stream, so audio
; drawing a different number of values can't shift gameplay's values.
rand_isolate=1

; 1 = trace every draw from the engine's random generator (diagnostic; doesn't
; change what the game does). Compare two runs with harness\diff_mt.py.
mt_trace=1

; 1 = place every streamed-in spawn exactly spawn_delay frames after it's queued,
; forcing its load if needed, so loader speed can't change the frame. Record and
; replay only. A recording and its replays must use the same values.
spawn_gate=1
spawn_delay=15

[graphics]
; Engine-side graphics settings found by decompiling the game. They work in
; every mode, passthrough included. With mode=passthrough the log goes to
; harness\graphics.log. Each patch checks the game's code first and is skipped
; (with a log line) if it doesn't match this build. Leave a value empty to keep
; the game's own setting.
enabled=0

; Frame limiter. The game caps at 60 (or 30 with the menu option) and always
; uses vsync, so the real limit is min(this, monitor refresh).
; e.g. 144; -1 = no limiter (vsync only). Ignored while fixed_timestep=1.
; Keep it empty (60) for co-op.
fps_limit=

; Small-object pop-in. The game drops objects smaller than cull_pop on screen
; and fades them in up to cull_fade (game: 15 / 25). Lower = more detail far
; away, more draw calls. Try 4 / 8. 0 / 0 = never drop.
cull_pop=
cull_fade=

; The same for shadow casters, per shadow cascade (game: 5 / 15 / 25). Lower
; keeps small objects' shadows in the distance. The --hiresshadows launch
; option bypasses these entirely.
shadow_cull_near=
shadow_cull_mid=
shadow_cull_far=

; Multiplier on character/actor LOD distances from actorlod.var (game: 1.0,
; i.e. 10/20/25/50 m bands). Try 2.0. Range 0.25..8.
lod_scale=

; Multiplier on every model's own fade-out distance (set per model in the
; level data): objects and scenery that vanish in the distance stay visible
; this many times farther. Render-only. Try 3. Range 0.25..16.
object_fade_scale=

; Multiplier on the distance where world chunks swap from their low- to their
; high-detail model (LODEntitySwapper's LODDistance). Try 3. Range 0.25..8.
; This streams in more detail, so keep it the same for both players in co-op.
world_lod_scale=

; Render targets the game makes at half resolution. 1 = full resolution.
; Full-res glow also makes the half-res depth buffer glow draws into (the
; "Depth 1/2" pass) full size, since the engine requires matching sizes.
; Glow's blur was tuned for half resolution, so bloom gets narrower with it on.
full_res_reflection=0
full_res_glow=0

; ---- Texture filtering, display, anti-aliasing (render-only) ----------------
; Anisotropic filtering on the game's bilinear/trilinear textures: 2..16, or
; 0 for the game's own filtering. Sharper ground and walls at angles.
anisotropy=0

; 1 = variable refresh rate (G-Sync/FreeSync): present without vsync and allow
; tearing. Needs a VRR monitor and borderless/windowed mode (exclusive
; fullscreen keeps vsync). Cap the frame rate a few FPS below your refresh rate
; with fps_limit (e.g. 141 on a 144 Hz monitor). Without VRR this tears.
vrr=0

; FXAA 3.11 on the finished frame (applied at Present, so the HUD is smoothed
; slightly too). subpix 0..1 = how much single-pixel aliasing is removed;
; edge = local contrast needed to treat a pixel as an edge (lower = more AA).
fxaa=0
fxaa_subpix=0.75
fxaa_edge=0.125
fxaa_edge_min=0.0312

; ---- Lighting and shadows -------------------------------------------------
; Light shafts (volumetric light) resolution: 4 = game (1/4), 2 = half, 1 = full.
volumetric_res=4

; Sun shadow map resolution: the game uses a 640x1920 atlas (three 640x640
; cascades). 2 = 1280x3840, 3 = 1920x5760, 4 = 2560x7680 (sharper shadow edges,
; more GPU memory and shadow rendering cost). 1 = game.
shadow_res=1

; 1 = smoother sun shadow edges: the game's shadow filter (16 single-texel
; depth compares, laid out for the 640x1920 map) is replaced, when the
; pipeline is created, with a bilinear one that also uses the extra texels of
; shadow_res 2..4. Same softness, bias and cascades as the game's. Render-only.
soft_shadows=0

; 1 = less noisy ambient occlusion: the game's SSAO takes 3 sample pairs per
; pixel; this replacement takes 8 with the same strength and range, so contact
; shadows in corners are smoother and less blotchy. Render-only.
better_ao=0

; 1 = soft character shadow: the blob shadow under each character is one hard
; depth compare in the game; this replacement filters it over 5x5 texels of its
; 512x512 map, so its edge no longer stair-steps. Render-only.
soft_char_shadow=0

; 1 = no depth clipping on the shadow-caster pipelines (TEST, default 0). On its
; own it changes nothing: the game's shadow vertex shader already flattens
; anything nearer the sun than the cascade onto its near plane (z = max(z, 0)).
; It's the half of shadow_noclamp_vs that the GPU does. Render-only.
shadow_pancake=0

; 1 = fix for the "square around the character" where shadows go missing or
; jump as the camera moves (stock bug, default 0). The game flattens shadow
; casters per VERTEX, so a big triangle (a wall, the bedroom window frame) with
; one corner high above the nearest cascade gets the wrong depth across its
; whole surface and stops casting over a patch. This swaps the static caster
; vertex shaders (shadowdepth_, shadowdepth_ak_) for copies without that clamp,
; with depth clipping off, only while the sun shadow map is being drawn. The
; GPU then flattens per pixel, which is correct. Set shadow_near_extend=0 with
; it. Render-only. See re\STOCK_BUGS.md.
shadow_noclamp_vs=0

; Metres to move each sun shadow cascade's near plane toward the sun (TEST,
; default 0). It hides the same bug as shadow_noclamp_vs (50 = much better),
; but contact shadows lift slightly (the constant depth bias grows with the
; range, about 1 cm per 10 m at the nearest cascade). Render-only.
shadow_near_extend=0

; Shadow-cull settings (default 0):
;   shadow_no_contrib = 1: no size-based culling of shadow casters. Small props
;                          (railings, awning boards) then cast shadows at every
;                          distance, not just in a box around the player. Their
;                          own per-model limits ignore shadow_cull_*. Costs more
;                          shadow draws. Render-only.
;   shadow_all_zones  = 1: diagnostic; casters from every visibility zone;
;   shadow_caster_log = 1: diagnostic; log each cascade's caster count.
shadow_all_zones=0
shadow_no_contrib=0
shadow_caster_log=0

; 1 = shadow cascade view (DIAGNOSTIC, default 0): the sun-shadow filter
; multiplies its result by a brightness per cascade, alternating so every edge
; is a hard line: nearest 1.0, middle 0.3, far 1.0, and 0.0 (fully shadowed)
; outside all three, so each cascade shows as a band. Use it
; to see whether a shadow artefact's edges line up with a cascade boundary.
; Takes priority over soft_shadows. Render-only. See re\STOCK_BUGS.md.
shadow_debug=0

; 1 = log every depth-only pipeline once (DSV format, depth bias, slope, clamp,
; cull, depth clip, VS digest, caster verdict), to check which ones
; shadow_pancake treats as shadow casters. Diagnostic only.
shadow_pso_log=0

; Shadow cascades, overriding the level's settings (0 = the level's value).
; Cascades 1..4, but DON'T raise it above what the level asks for (usually 3):
; tested in the Toy Box, 4 draws a large dark band across the ground (the
; shadow data is set up for the level's count). Lowering it is safe;
; far = shadow distance in metres (10..360; levels default to about 50);
; split = how cascades are spread between near and far (0..0.8).
shadow_cascades=0
shadow_far=0
shadow_split=0

; Override named lighting parameters as the game sets them, e.g.
;   light_override=g_sunLightSoftness=2; g_FogStart=60; g_FogEnd=400
; Up to 16 entries "name=value[,value,value,value]" separated by ';'. Names the
; shaders use: g_sunLightSoftness g_sunLightIntensity g_sunLightPrimary
; g_sunLightTertiary g_FogStart g_FogEnd g_FogBlend g_Bloom_opacity
; g_Bloom_color g_Glow_Multiply g_Desaturate g_VolumetricLightDensity
; g_VolumetricLightExposure g_VolumetricLightDecay g_VolumetricLightWeight
; g_rimLightModifier g_rimLightColor g_characterLightIntensity
; g_ambientBlendValue g_ShadowFar g_ShadowTransitionStart g_ShadowTransitionEnd
light_override=

; NOTE: lod_scale, world_lod_scale and the cull values may change what the game
; simulates. Recordings and their replays, and both players in co-op, must use
; the same values.

[debug_menu]
; In-game debug menu (cheats, god mode, game speed, progress, levels, teleport,
; FXAA, field of view, info), drawn with the game's own fonts. Open/close: hold
; LB + RB and press Y on pad 1, or F1. D-pad to move, A to toggle, Left/Right to
; change values, B to close. While it's open the game sees a neutral pad 1.
; Teleport: move a player to the other player, to a saved spot, or to one of the
; level's spawn points. Free camera: the menu closes and the pad flies the view
; (left stick move, right stick look, triggers down/up, A fast) while the game
; sees a neutral pad; open the menu again to turn it off. In online co-op, player
; 1's cheats, speed, level loads and teleports apply to both PCs; field of view
; and the free camera are per PC (render only).
; 0 = off (no hooks). Without an ini file it's always off.
enabled=1
